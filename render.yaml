services:
  - type: web
    name: ht-meetings
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ht-meetings-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: ht-meetings-db
    plan: basic-256mb
    databaseName: htmeetings
    user: htmeetings
